# =============================================================================
# Default parameters for the belief inference epistemic planning system.
#
# This file defines ALL tunable parameters with their defaults.
# Experiment-specific configs override only what differs.
#
# Usage:
#   python scripts/experiments/run/single.py -m belief_experiment5 \
#       --config scripts/experiments/configs/defaults.yaml
#
#   python scripts/experiments/run/batch.py -m belief_experiment5 -n 100 \
#       --config scripts/experiments/configs/mcts_kalman.yaml
# =============================================================================

# --- Simulation ---
simulation:
  fps: 20
  max_steps: 500
  seed: 21

# --- Inference ---
inference:
  type: mcts_kalman           # none | naive | mcts_naive | mcts_resample | mcts_kalman
  relevance_method: naive     # corridor | dual | naive
  warmup_fraction: 0.2        # max history window as fraction of horizon (naive only)
  boltzmann_beta: 10.0        # rationality parameter (higher = more deterministic)
  vel_weight: 1.0             # velocity tracking weight in cost function
  hidden_threshold: 0.6       # awareness threshold for discretising visibility

# --- Intervention ---
intervention:
  type: agency_only           # none | agency_only | combined | policy_only | always_policy
  ref_controls: mcts-qcbf    # opt | mcts-greedy | mcts-qcbf
  w_agency: 1.0               # agency weight for intervention cost
  qcbf_gamma: 0.8             # safety strictness for mcts-qcbf

# --- Planning ---
planning:
  mode: longitudinal          # 2d | longitudinal
  horizon: 40                 # planning steps (fine resolution)
  dt: 0.1                     # fine planning timestep (s)
  target_speed: 5.0           # desired cruising speed (m/s)
  collision_margin: 0.9       # safety margin around obstacles (m)

# --- MCTS ---
mcts:
  n_simulations: 400          # tree search iterations per planning step
  exploration_constant: 10.0  # UCB1 exploration coefficient
  n_accel_levels: 19          # discrete acceleration action levels
  max_trajectories: 5         # coarse trajectories extracted from tree
  gamma: 0.99                 # discount factor
  collision_penalty: 100.0    # penalty for collision in reward
  coarseness_factor: 5        # coarse timestep = N * fine timestep

# --- Kalman awareness filter ---
kalman:
  A: 1.0                      # state transition (persistence, 1.0 = no decay)
  b: 1.0                      # feature weight (larger = faster awareness shift)
  q: 0.05                     # process noise variance
  R: 1.0                      # observation noise variance
  phi_th: 0.5                 # awareness threshold for discretisation
  psi_0: 7.0                  # initial logit mean (7.0 → φ≈1.0, assume visible)
  P_0: 1.0                    # initial variance

# --- Attention kernel ---
# Awareness: dual-RBF (omnidirectional + FOV-gated)
# Velocity:  single FOV-gated RBF only
kernel:
  sigma_1: 15.0               # awareness: narrow RBF spread, omnidirectional (m)
  sigma_2: 25.0               # awareness: wide RBF spread, FOV-gated (m)
  sigma_vel: 25.0             # velocity: RBF spread, FOV-gated (m)
  fov_half_angle: 30.0        # half FOV angle (degrees, shared)
  w1: 0.7                     # awareness: weight for omnidirectional RBF
  w2: 0.3                     # awareness: weight for FOV-gated RBF

# --- Velocity particles (kappa estimation) ---
velocity:
  n_kappa_particles: 0        # particles per agent (0 = disabled, 4 = recommended)
  kappa_min: 0.3              # lower bound of kappa range
  b_kappa: 0.1                # drift rate toward kappa = 1.0
  q_kappa: 0.001              # process noise variance (std ≈ 0.03)
  resample_noise: 0.05        # std of noise added after resampling
  neff_threshold_frac: 0.5    # resample when ESS < K * this fraction

# --- NLP (second stage, bicycle model) ---
nlp:
  a_min: -3.0                 # min acceleration (m/s^2)
  a_max: 3.0                  # max acceleration (m/s^2)
  delta_max: 0.45             # max steering angle (rad)
  delta_rate_max: 0.18        # max steering rate (rad/s)
  jerk_max: 1.0               # max jerk (m/s^3)
  v_min: 0.0                  # min velocity (m/s)
  v_max: 10.0                 # max velocity (m/s)
  w_s: 0.1                    # weight: longitudinal position tracking
  w_d: 10.0                   # weight: lateral position tracking
  w_v: 0.01                   # weight: velocity tracking
  w_a: 1.0                    # weight: acceleration norm
  w_delta: 2.0                # weight: steering angle norm
  w_phi: 2.0                  # weight: heading alignment

# --- MILP (first stage, point-mass) ---
milp:
  a_s_min: -3.0               # min longitudinal acceleration (m/s^2)
  a_s_max: 3.0                # max longitudinal acceleration (m/s^2)
  a_d_min: -3.0               # min lateral acceleration (m/s^2)
  a_d_max: 3.0                # max lateral acceleration (m/s^2)
  jerk_s_max: 1.0             # max longitudinal jerk (m/s^3)
  jerk_d_max: 1.0             # max lateral jerk (m/s^3)
  vs_min: 0.0                 # min longitudinal velocity (m/s)
  vs_max: 10.0                # max longitudinal velocity (m/s)
  vd_min: -10.0               # min lateral velocity (m/s)
  vd_max: 10.0                # max lateral velocity (m/s)
  rho: 1.5                    # softplus smoothness
  w_s: 0.9                    # weight: longitudinal position tracking
  w_d: 10.0                   # weight: lateral position tracking
  w_v: 0.01                   # weight: velocity tracking
  w_a_s: 0.5                  # weight: longitudinal acceleration norm
  w_a_d: 0.5                  # weight: lateral acceleration norm
